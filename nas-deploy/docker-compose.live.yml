  # ---- Cloudflare Tunnel（已启用，Token 属敏感凭据勿外传）----
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?未设置，见 .env.example}
